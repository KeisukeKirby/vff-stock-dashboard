<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VFF 在庫一覧</title>
<style>
:root{
  --bg:#0F1B14; --panel:#16241C; --panel-2:#1C2E23; --line:#2A3E31;
  --ink:#EDF3EC; --ink-dim:#AFC4B6; --ink-faint:#7E9587; --accent:#E8A33D;
  /* status colours - always shown with a text label */
  --st-out:#e66767; --st-order:#ec835a; --st-ok:#199e70; --st-excess:#3987e5; --st-idle:#898781; --st-incoming:#9085e9;
  --sans:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Meiryo","Yu Gothic",sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,"Roboto Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{margin:0;background:radial-gradient(1200px 500px at 10% -10%, rgba(232,163,61,.07), transparent),var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:26px 16px 60px;}
.wrap{max-width:1240px;margin:0 auto;}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
h1{margin:0;font-size:26px;font-weight:700;}
.period{font-family:var(--mono);color:var(--ink-dim);font-size:12.5px;line-height:1.7;}
.period b{color:var(--ink);font-weight:600;}

.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);}
.kpi.out::before{background:var(--st-out);} .kpi.order::before{background:var(--st-order);} .kpi.excess::before{background:var(--st-excess);}
.kpi-label{font-size:12px;color:var(--ink-dim);margin-bottom:6px;}
.kpi-value{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;}
.kpi-value small{font-size:13px;font-weight:500;color:var(--ink-dim);margin-left:3px;}
.kpi-sub{font-size:11.5px;color:var(--ink-dim);margin-top:5px;}

section.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px;}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.card h2{margin:0;font-size:16px;font-weight:700;}
.card h2 .num{font-family:var(--mono);color:var(--accent);font-size:12px;margin-right:8px;letter-spacing:.06em;}
.card .desc{font-size:12.5px;color:var(--ink-dim);margin-top:4px;}
.note{font-size:12px;color:var(--ink-faint);margin-top:10px;line-height:1.6;}
.note b{color:var(--ink-dim);font-weight:600;}

.filters{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:4px 0 12px;}
.filters .lbl{font-size:12px;color:var(--ink-dim);margin-right:6px;}
select,input[type=text]{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:var(--sans);font-size:13px;}
.btn{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-family:var(--sans);font-size:13px;cursor:pointer;}
.btn.primary{background:var(--accent);color:#16241C;border-color:var(--accent);font-weight:700;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink-dim);cursor:pointer;display:inline-flex;align-items:center;gap:6px;user-select:none;}
.chip .dot{width:8px;height:8px;border-radius:50%;}
.chip .n{font-family:var(--mono);font-size:11px;}
.chip.active{color:var(--ink);background:var(--panel);border-color:var(--ink-faint);}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap;}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.st-out{color:var(--st-out);border-color:var(--st-out);background:rgba(230,103,103,.12);}
.st-order{color:var(--st-order);border-color:var(--st-order);background:rgba(236,131,90,.12);}
.st-ok{color:var(--st-ok);border-color:var(--st-ok);background:rgba(25,158,112,.10);}
.st-excess{color:var(--st-excess);border-color:var(--st-excess);background:rgba(57,135,229,.10);}
.st-idle{color:var(--st-idle);border-color:var(--st-idle);background:rgba(137,135,129,.12);}
.st-incoming{color:var(--st-incoming);border-color:var(--st-incoming);background:rgba(144,133,233,.12);}
.st-none{color:var(--ink-faint);border-color:var(--line);}

.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th,.tbl td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;}
.tbl th{color:var(--ink-dim);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--panel-2);cursor:pointer;user-select:none;z-index:1;line-height:1.3;}
.tbl th.sorted{color:var(--accent);}
.tbl th.l,.tbl td.l{text-align:left;}
.tbl td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.tbl td.dim{color:var(--ink-faint);}
.tbl tr:hover td{background:rgba(255,255,255,.03);}
.tbl tr.item-start td{border-top:2px solid #3A5244;}
.tbl tr.total td{font-weight:700;background:var(--panel-2);}
.bar{display:inline-block;height:8px;border-radius:2px;background:var(--accent);vertical-align:middle;margin-right:6px;}
.muted{color:var(--ink-faint);font-weight:400;}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-dim);margin-top:10px;}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;}
footer{text-align:center;font-size:11.5px;color:var(--ink-faint);margin-top:8px;}
@media (max-width:900px){ .kpi-row{grid-template-columns:repeat(3,1fr);} }
@media (max-width:600px){ body{padding:18px 12px 40px;} h1{font-size:21px;} .kpi-row{grid-template-columns:repeat(2,1fr);gap:8px;} .kpi-value{font-size:24px;} section.card{padding:14px;} }
</style>
</head>

</div>

<script>
(function(){
'use strict';
const D = DATA, SK = D.skus, SALES = D.sales;
const MONTHS = SALES.months;            // 2026-01 .. 2026-08
const RECENT = SALES.recent;            // last 3 months
const STATUS = {
  out:      {label: '欠品中',   color: 'var(--st-out)',      sev: 0, desc: '在庫0で、今年の販売がある'},
  order:    {label: '要発注',   color: 'var(--st-order)',    sev: 1, desc: '在庫月数がリードタイム未満'},
  ok:       {label: '適正',     color: 'var(--st-ok)',       sev: 2, desc: 'リードタイム〜12ヶ月分'},
  excess:   {label: '在庫過剰', color: 'var(--st-excess)',   sev: 3, desc: '在庫月数が12ヶ月超'},
  idle:     {label: '動きなし', color: 'var(--st-idle)',     sev: 4, desc: '今年の販売が0で在庫だけある'},
  incoming: {label: '入荷待ち', color: 'var(--st-incoming)', sev: 5, desc: '在庫0・販売0・発注済み(新色/新モデル)'},
  none:     {label: '在庫なし', color: 'var(--ink-faint)',   sev: 6, desc: '在庫0・販売0・発注なし'},
};
const S = {lead: 3, status: new Set(Object.keys(STATUS).filter(k => k !== 'none')), model: '', gender: '', color: '', sort: null, dir: 1};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const fmt = n => Math.round(n).toLocaleString('ja-JP');
const fmt1 = n => (Math.round(n * 10) / 10).toLocaleString('ja-JP', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const mLab = m => `${+m.slice(5)}月`;
const badge = k => `<span class="badge st-${k}"><span class="dot"></span>${STATUS[k].label}</span>`;
const coverText = s => s.avg > 0 ? (s.stock <= 0 ? '0' : s.cover >= 36 ? '36+' : fmt1(s.cover)) : (s.stock > 0 ? '—' : '0');

// ---- per-SKU figures (all from the stock sheet) ----
function monthsOnSale(s) { if (!s.first_import) return 0; if (s.first_import < MONTHS[0]) return MONTHS.length; const i = MONTHS.indexOf(s.first_import); return i < 0 ? 0 : MONTHS.length - i; }
function statusOf(x) {
  if (x.stock <= 0) return x.avg > 0 ? 'out' : (x.on_order > 0 ? 'incoming' : 'none');
  if (x.avg <= 0) return 'idle';
  if (x.cover < S.lead) return 'order';
  if (x.cover > 12) return 'excess';
  return 'ok';
}
function compute() {
  SK.forEach(s => { s.months = monthsOnSale(s); s.avg = s.months > 0 ? s.s2026 / s.months : 0; s.cover = s.avg > 0 ? s.stock / s.avg : (s.stock > 0 ? Infinity : 0); s.status = statusOf(s); });
  // model rows (Excel model); JSON figures come from the mapped sales model, shown once per sales model
  const map = new Map();
  // model-level 月平均 is the sum of its SKUs' 月平均, so it matches the SKU table and the KPI strip
  SK.forEach(s => { let g = map.get(s.model); if (!g) { g = {model: s.model, sales_model: s.sales_model, stock: 0, on_order: 0, s2026: 0, avg: 0, skus: 0}; map.set(s.model, g); } g.stock += s.stock; g.on_order += s.on_order; g.s2026 += s.s2026; g.avg += s.avg; g.skus++; });
  const models = [...map.values()].sort((a, b) => b.s2026 - a.s2026);
  const seen = new Set();
  models.forEach(g => {
    g.cover = g.avg > 0 ? g.stock / g.avg : (g.stock > 0 ? Infinity : 0); g.status = statusOf(g);
    const mq = g.sales_model ? SALES.model_monthly_qty[g.sales_model] : null;
    g.primary = !!mq && !seen.has(g.sales_model); if (mq) seen.add(g.sales_model);
    g.recent = mq ? RECENT.map(m => mq[m] || 0) : null;
    g.json2026 = mq ? MONTHS.reduce((a, m) => a + (mq[m] || 0), 0) : null;
  });
  return models;
}

// ---- render ----
function renderKpis(models) {
  const stock = SK.reduce((a, s) => a + s.stock, 0), avg = SK.reduce((a, s) => a + s.avg, 0), onOrder = SK.reduce((a, s) => a + s.on_order, 0);
  const cnt = k => SK.filter(s => s.status === k).length;
  $('kpis').innerHTML = `
    <div class="kpi"><div class="kpi-label">総在庫(${D.as_of})</div><div class="kpi-value">${fmt(stock)}<small>足</small></div><div class="kpi-sub">${SK.length} SKU · ${models.length} モデル · 入荷予定 +${fmt(onOrder)}</div></div>
    <div class="kpi"><div class="kpi-label">月平均販売(2026年・在庫表)</div><div class="kpi-value">${fmt(avg)}<small>足/月</small></div><div class="kpi-sub">2026年1〜8月 計 ${fmt(SK.reduce((a, s) => a + s.s2026, 0))}足</div></div>
    <div class="kpi"><div class="kpi-label">在庫月数(全体)</div><div class="kpi-value">${fmt1(stock / avg)}<small>ヶ月</small></div><div class="kpi-sub">在庫 ÷ 月平均</div></div>
    <div class="kpi out"><div class="kpi-label">欠品中</div><div class="kpi-value">${cnt('out')}<small>SKU</small></div><div class="kpi-sub">在庫0で今年販売あり</div></div>
    <div class="kpi order"><div class="kpi-label">要発注</div><div class="kpi-value">${cnt('order')}<small>SKU</small></div><div class="kpi-sub">在庫月数 ${S.lead}ヶ月未満</div></div>
    <div class="kpi excess"><div class="kpi-label">在庫過剰</div><div class="kpi-value">${cnt('excess')}<small>SKU</small></div><div class="kpi-sub">在庫月数 12ヶ月超 · 計 ${fmt(SK.filter(s => s.status === 'excess').reduce((a, s) => a + s.stock, 0))}足</div></div>`;
}
function renderModels(models) {
  const maxStock = Math.max(...models.map(g => g.stock), 1);
  const tot = {stock: 0, on_order: 0, s2026: 0, avg: 0, recent: RECENT.map(() => 0), json2026: 0};
  models.forEach(g => { tot.stock += g.stock; tot.on_order += g.on_order; tot.s2026 += g.s2026; tot.avg += g.avg; if (g.primary) { g.recent.forEach((v, i) => tot.recent[i] += v); tot.json2026 += g.json2026; } });
  const recentAvg = r => fmt1(r.reduce((a, b) => a + b, 0) / RECENT.length);
  $('modelTable').innerHTML = `<table class="tbl"><thead><tr>
      <th class="l">モデル</th><th>在庫</th><th>入荷予定</th><th>2026年販売<br><span class="muted">在庫表</span></th><th>月平均<br><span class="muted">SKU合計</span></th><th>在庫月数</th><th class="l">ステータス</th>
      ${RECENT.map(m => `<th>${mLab(m)}<br><span class="muted">実績JSON</span></th>`).join('')}<th>直近3ヶ月<br><span class="muted">月平均</span></th><th>2026年計<br><span class="muted">実績JSON</span></th>
    </tr></thead><tbody>${models.map(g => `<tr>
      <td class="l"><span class="bar" style="width:${Math.max(2, g.stock / maxStock * 90)}px"></span>${esc(g.model)}</td>
      <td class="num">${fmt(g.stock)}</td><td class="num dim">${g.on_order ? '+' + fmt(g.on_order) : ''}</td><td class="num">${fmt(g.s2026)}</td><td class="num">${fmt1(g.avg)}</td><td class="num">${coverText(g)}</td><td class="l">${badge(g.status)}</td>
      ${g.primary ? g.recent.map(v => `<td class="num">${fmt(v)}</td>`).join('') + `<td class="num">${recentAvg(g.recent)}</td><td class="num">${fmt(g.json2026)}</td>`
                  : `<td class="dim l" colspan="${RECENT.length + 2}">${g.sales_model ? `${esc(g.sales_model.replace(/^VFF /, ''))} に含まれる` : '実績JSONに該当なし'}</td>`}
    </tr>`).join('')}<tr class="total"><td class="l">合計</td><td class="num">${fmt(tot.stock)}</td><td class="num">+${fmt(tot.on_order)}</td><td class="num">${fmt(tot.s2026)}</td><td class="num">${fmt1(tot.avg)}</td><td class="num">${fmt1(tot.stock / tot.avg)}</td><td></td>${tot.recent.map(v => `<td class="num">${fmt(v)}</td>`).join('')}<td class="num">${recentAvg(tot.recent)}</td><td class="num">${fmt(tot.json2026)}</td></tr></tbody></table>`;
  $('modelNote').innerHTML = `実績JSONの 2026年計 と在庫表の 2026年販売 の差(約 ${fmt(tot.json2026 - tot.s2026)}足)は、主に <b>${+D.export_month.slice(5)}月の一括輸出 ${fmt(D.export_total)}足</b>(V-Soul / V-Run / Trailope)が在庫表の販売列に含まれていないため。6月の数字を見るときは注意。`;
}
const COLS = [
  {k: 'model', l: 'モデル', left: true}, {k: 'gender', l: '性別', left: true}, {k: 'color', l: 'カラー', left: true}, {k: 'size_num', l: 'サイズ', left: true, r: s => esc(s.size)},
  {k: 'stock', l: '在庫', r: s => fmt(s.stock)}, {k: 'on_order', l: '入荷予定', r: s => s.on_order ? '+' + fmt(s.on_order) : '', dim: true},
  {k: 's2026', l: '2026年販売', r: s => fmt(s.s2026)}, {k: 'months', l: '販売月数', r: s => s.months ? `${s.months}` : '', dim: true},
  {k: 'avg', l: '月平均', r: s => fmt1(s.avg)}, {k: 'cover', l: '在庫月数', r: s => coverText(s)},
  {k: 'status', l: 'ステータス', left: true, r: s => badge(s.status)}, {k: 'first_import', l: '初入荷', left: true, r: s => esc(s.first_import || ''), dim: true},
];
function defaultSort(a, b) { return (b.modelSales - a.modelSales) || a.model.localeCompare(b.model) || a.gender.localeCompare(b.gender) || (b.itemSales - a.itemSales) || a.color.localeCompare(b.color) || (a.size_num - b.size_num); }
function renderSkus(models) {
  const modelSales = Object.fromEntries(models.map(g => [g.model, g.s2026]));
  const itemSales = {}; SK.forEach(s => itemSales[s.item] = (itemSales[s.item] || 0) + s.s2026);
  SK.forEach(s => { s.modelSales = modelSales[s.model]; s.itemSales = itemSales[s.item]; });
  const counts = {}; SK.forEach(s => counts[s.status] = (counts[s.status] || 0) + 1);
  $('statusChips').innerHTML = Object.keys(STATUS).map(k => `<span class="chip ${S.status.has(k) ? 'active' : ''}" data-k="${k}"><span class="dot" style="background:${STATUS[k].color}"></span>${STATUS[k].label}<span class="n">${counts[k] || 0}</span></span>`).join('');
  $('statusChips').querySelectorAll('.chip').forEach(c => c.onclick = () => { const k = c.dataset.k; S.status.has(k) ? S.status.delete(k) : S.status.add(k); renderSkus(models); });
  const ms = $('modelSel'); ms.innerHTML = `<option value="">すべて</option>` + models.map(g => `<option value="${esc(g.model)}">${esc(g.model)}</option>`).join(''); ms.value = S.model;
  const q = S.color.trim().toLowerCase();
  let rows = SK.filter(s => S.status.has(s.status) && (!S.model || s.model === S.model) && (!S.gender || s.gender === S.gender) && (!q || s.color.toLowerCase().includes(q)));
  if (S.sort) { const k = S.sort; rows.sort((a, b) => { const av = a[k], bv = b[k]; const c = typeof av === 'number' && typeof bv === 'number' ? (av === bv ? 0 : (av === Infinity ? 1 : bv === Infinity ? -1 : av - bv)) : String(av ?? '').localeCompare(String(bv ?? '')); return c * S.dir || defaultSort(a, b); }); }
  else rows.sort(defaultSort);
  $('count').textContent = `${rows.length} / ${SK.length} SKU · 在庫 ${fmt(rows.reduce((a, s) => a + s.stock, 0))}足`;
  let prevItem = null;
  $('skuTable').innerHTML = `<table class="tbl"><thead><tr>${COLS.map(c => `<th class="${c.left ? 'l' : ''} ${S.sort === c.k ? 'sorted' : ''}" data-k="${c.k}">${c.l}${S.sort === c.k ? (S.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>${rows.map(s => { const start = !S.sort && s.item !== prevItem; prevItem = s.item; return `<tr class="${start ? 'item-start' : ''}">${COLS.map(c => `<td class="${c.left ? 'l' : 'num'} ${c.dim ? 'dim' : ''}">${c.r ? c.r(s) : esc(s[c.k])}</td>`).join('')}</tr>`; }).join('')}</tbody></table>`;
  // click cycle: first direction (desc for numbers, asc for text) -> reverse -> back to the default grouping
  const firstDir = k => ['stock', 'on_order', 's2026', 'avg', 'cover', 'months'].includes(k) ? -1 : 1;
  $('skuTable').querySelectorAll('th').forEach(th => th.onclick = () => { const k = th.dataset.k; if (S.sort === k) { if (S.dir === firstDir(k)) S.dir = -S.dir; else { S.sort = null; S.dir = 1; } } else { S.sort = k; S.dir = firstDir(k); } renderSkus(models); });
  $('legend').innerHTML = Object.keys(STATUS).map(k => `<span><span class="sw" style="background:${STATUS[k].color}"></span>${STATUS[k].label} <span class="muted">— ${STATUS[k].desc}</span></span>`).join('');
}
function exportCsv() {
  const head = ['モデル', '性別', 'カラー', 'サイズ', '在庫', '入荷予定', '2026年販売', '販売月数', '月平均', '在庫月数', 'ステータス', '初入荷', '2025年販売', '2024年販売'];
  const rows = SK.slice().sort(defaultSort).map(s => [s.model, s.gender, s.color, s.size, s.stock, s.on_order, s.s2026, s.months, s.avg.toFixed(2), s.avg > 0 ? (s.cover >= 99 ? '99+' : s.cover.toFixed(1)) : (s.stock > 0 ? 'inf' : '0'), STATUS[s.status].label, s.first_import || '', s.s2025, s.s2024]);
  const csv = '﻿' + [head, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'})); a.download = `vff_stock_${D.as_of}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function renderAll() { const models = compute(); renderKpis(models); renderModels(models); renderSkus(models); }

$('periodLine').innerHTML = `在庫: <b>${D.as_of}</b> 時点(${esc(D.source_file)}、Balance 列)<br>販売実績: <b>${MONTHS[0]}〜${MONTHS[MONTHS.length - 1]}</b>(sales-1st-half-26-dashboard)`;
$('skuNote').innerHTML = `<b>データの注記</b>: 在庫 = 在庫表の Balance 列(輸入累計 − 販売累計)。Office 列(実棚)は7月入荷分が未記入のため未使用。入荷予定 = Order Import 列(到着月は在庫表に無い)。
  SKU別の月次販売は販売実績ダッシュボードに無いため、SKU行の販売数は在庫表の2026年累計を使い、直近3ヶ月はモデル別サマリーにのみ表示。Trailope WP は Trailope、Groundsplay LS は Groundsplay として実績JSONに含まれる。Scramkey はサイズ表記に M/W が無くユニセックス(U)扱い。`;
$('footer').textContent = `ビルド ${D.built_at} · 在庫 ${SK.length} SKU · 販売実績ソース ${SALES.source_repo}@${(SALES.source_commit || '').slice(0, 7)}`;
$('leadSel').onchange = e => { S.lead = +e.target.value; renderAll(); };
$('modelSel').onchange = e => { S.model = e.target.value; renderAll(); };
$('genderSel').onchange = e => { S.gender = e.target.value; renderAll(); };
$('colorInput').oninput = e => { S.color = e.target.value; renderAll(); };
$('csvBtn').onclick = exportCsv;
renderAll();
})();
</script>
</body>
</html>
