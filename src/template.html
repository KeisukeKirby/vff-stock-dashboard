<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VFF 在庫一覧</title>
<style>
:root{
  --bg:#0F1B14; --panel:#16241C; --panel-2:#1C2E23; --line:#2A3E31;
  --ink:#EDF3EC; --ink-dim:#AFC4B6; --ink-faint:#7E9587; --accent:#E8A33D;
  /* status colours - always shown with a text label */
  --st-out:#e66767; --st-order:#ec835a; --st-ok:#199e70; --st-excess:#3987e5; --st-idle:#898781; --st-incoming:#9085e9;
  --sans:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Meiryo","Yu Gothic",sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,"Roboto Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{margin:0;background:radial-gradient(1200px 500px at 10% -10%, rgba(232,163,61,.07), transparent),var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:26px 16px 60px;}
.wrap{max-width:1240px;margin:0 auto;}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:14px;}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
h1{margin:0;font-size:26px;font-weight:700;}
.period{font-family:var(--mono);color:var(--ink-dim);font-size:12.5px;line-height:1.7;}
.period b{color:var(--ink);font-weight:600;}

nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;}
nav.tabs button{background:none;border:none;padding:11px 18px;font-size:14px;font-family:var(--sans);font-weight:600;color:var(--ink-dim);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}
nav.tabs button:hover{color:var(--ink);}
.tabpanel{display:none;} .tabpanel.active{display:block;}

.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);}
.kpi.out::before{background:var(--st-out);} .kpi.order::before{background:var(--st-order);} .kpi.excess::before{background:var(--st-excess);}
.kpi-label{font-size:12px;color:var(--ink-dim);margin-bottom:6px;}
.kpi-value{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;}
.kpi-value small{font-size:13px;font-weight:500;color:var(--ink-dim);margin-left:3px;}
.kpi-sub{font-size:11.5px;color:var(--ink-dim);margin-top:5px;}

section.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px;}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.card h2{margin:0;font-size:16px;font-weight:700;}
.card h2 .num{font-family:var(--mono);color:var(--accent);font-size:12px;margin-right:8px;letter-spacing:.06em;}
.card .desc{font-size:12.5px;color:var(--ink-dim);margin-top:4px;}
.note{font-size:12.5px;color:var(--ink-dim);margin-top:10px;line-height:1.7;}
.note b{color:var(--ink);font-weight:600;}
.note ul{margin:6px 0 0;padding-left:20px;} .note li{margin:2px 0;}
.defs{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-size:13px;margin-top:10px;}
.defs div{padding:6px 0;border-bottom:1px solid var(--line);}
.defs .k{color:var(--ink-dim);font-size:12px;}

.filters{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:4px 0 12px;}
.filters .lbl{font-size:12px;color:var(--ink-dim);margin-right:6px;}
select,input[type=text]{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:var(--sans);font-size:13px;}
.btn{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-family:var(--sans);font-size:13px;cursor:pointer;}
.btn.primary{background:var(--accent);color:#16241C;border-color:var(--accent);font-weight:700;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink-dim);cursor:pointer;display:inline-flex;align-items:center;gap:6px;user-select:none;}
.chip .dot{width:8px;height:8px;border-radius:50%;}
.chip .n{font-family:var(--mono);font-size:11px;}
.chip.active{color:var(--ink);background:var(--panel);border-color:var(--ink-faint);}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap;}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.st-out{color:var(--st-out);border-color:var(--st-out);background:rgba(230,103,103,.12);}
.st-order{color:var(--st-order);border-color:var(--st-order);background:rgba(236,131,90,.12);}
.st-ok{color:var(--st-ok);border-color:var(--st-ok);background:rgba(25,158,112,.10);}
.st-excess{color:var(--st-excess);border-color:var(--st-excess);background:rgba(57,135,229,.10);}
.st-idle{color:var(--st-idle);border-color:var(--st-idle);background:rgba(137,135,129,.12);}
.st-incoming{color:var(--st-incoming);border-color:var(--st-incoming);background:rgba(144,133,233,.12);}
.st-none{color:var(--ink-faint);border-color:var(--line);}

.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;}
.tbl th{color:var(--ink-dim);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--panel-2);cursor:pointer;user-select:none;z-index:1;line-height:1.3;}
.tbl th.sorted{color:var(--accent);}
.tbl th.l,.tbl td.l{text-align:left;}
.tbl td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.tbl td.dim{color:var(--ink-faint);}
.tbl tr:hover td{background:rgba(255,255,255,.03);}
.tbl tr.item-start td{border-top:2px solid #3A5244;}
.tbl tr.total td{font-weight:700;background:var(--panel-2);}
.bar{display:inline-block;height:8px;border-radius:2px;background:var(--accent);vertical-align:middle;margin-right:6px;}
.muted{color:var(--ink-faint);font-weight:400;}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-dim);margin-top:10px;}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;}
footer{text-align:center;font-size:11.5px;color:var(--ink-faint);margin-top:8px;}
@media (max-width:900px){ .kpi-row{grid-template-columns:repeat(3,1fr);} .defs{grid-template-columns:1fr;} }
@media (max-width:600px){ body{padding:18px 12px 40px;} h1{font-size:21px;} .kpi-row{grid-template-columns:repeat(2,1fr);gap:8px;} .kpi-value{font-size:24px;} section.card{padding:14px;} }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <div class="eyebrow">Barefoot Inc · Vibram FiveFingers</div>
    <h1>VFF 在庫一覧</h1>
  </div>
  <div class="period" id="periodLine"></div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="list" class="active">在庫一覧</button>
  <button data-tab="detail">詳細</button>
</nav>

<!-- ============ 在庫一覧 ============ -->
<div class="tabpanel active" id="tab-list">
  <section class="card">
    <div class="filters">
      <div class="chips" id="statusChips"></div>
    </div>
    <div class="filters">
      <span><span class="lbl">モデル</span><select id="modelSel"></select></span>
      <span><span class="lbl">性別</span><select id="genderSel"><option value="">すべて</option><option value="M">メンズ(M)</option><option value="W">ウィメンズ(W)</option><option value="U">ユニセックス(U)</option></select></span>
      <span><span class="lbl">カラー検索</span><input type="text" id="colorInput" placeholder="例: Black" size="12"></span>
      <span id="count" class="muted" style="font-size:12.5px"></span>
      <button class="btn primary" id="csvBtn" style="margin-left:auto">CSV書き出し</button>
    </div>
    <div class="tbl-wrap" style="max-height:78vh" id="skuTable"></div>
  </section>
</div>

<!-- ============ 詳細 ============ -->
<div class="tabpanel" id="tab-detail">
  <div class="kpi-row" id="kpis"></div>

  <section class="card">
    <div class="card-head">
      <div><h2><span class="num">01</span>設定と定義</h2>
        <div class="desc">在庫一覧のステータスは、ここで選んだリードタイムで判定します。</div></div>
      <span><span class="lbl" style="font-size:12px;color:var(--ink-dim);margin-right:6px">発注リードタイム</span><select id="leadSel"><option value="2">2ヶ月</option><option value="3" selected>3ヶ月</option><option value="4">4ヶ月</option></select></span>
    </div>
    <div class="legend" id="legend"></div>
    <div class="defs" id="defs"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <div><h2><span class="num">02</span>モデル別サマリー</h2>
        <div class="desc">在庫・2026年販売は在庫表(SKU合計)。月別の実績は販売実績ダッシュボードのモデル別月次(全カラー・全サイズ計)。</div></div>
    </div>
    <div class="tbl-wrap" id="modelTable"></div>
    <div class="note" id="modelNote"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <div><h2><span class="num">03</span>データについて</h2></div>
    </div>
    <div class="note" id="dataNote"></div>
  </section>
</div>

<footer id="footer"></footer>
</div>

<script>
const DATA = /*__DATA__*/null;
</script>
<script>
(function(){
'use strict';
const D = DATA, SK = D.skus, SALES = D.sales;
const MONTHS = SALES.months;            // 2026-01 .. 2026-08
const RECENT = SALES.recent;            // last 3 months
const STATUS = {
  out:      {label: '欠品中',   color: 'var(--st-out)',      desc: '在庫0で、今年の販売がある'},
  order:    {label: '要発注',   color: 'var(--st-order)',    desc: '在庫月数がリードタイム未満'},
  ok:       {label: '適正',     color: 'var(--st-ok)',       desc: 'リードタイム〜12ヶ月分'},
  excess:   {label: '在庫過剰', color: 'var(--st-excess)',   desc: '在庫月数が12ヶ月超'},
  idle:     {label: '動きなし', color: 'var(--st-idle)',     desc: '今年の販売が0で在庫だけある'},
  incoming: {label: '入荷待ち', color: 'var(--st-incoming)', desc: '在庫0・販売0・発注済み(新色/新モデル)'},
  none:     {label: '在庫なし', color: 'var(--ink-faint)',   desc: '在庫0・販売0・発注なし'},
};
const S = {lead: 3, status: new Set(Object.keys(STATUS).filter(k => k !== 'none')), model: '', gender: '', color: '', sort: null, dir: 1};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const fmt = n => Math.round(n).toLocaleString('ja-JP');
const fmt1 = n => (Math.round(n * 10) / 10).toLocaleString('ja-JP', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const mLab = m => `${+m.slice(5)}月`;
const badge = k => `<span class="badge st-${k}"><span class="dot"></span>${STATUS[k].label}</span>`;
const coverText = s => s.avg > 0 ? (s.stock <= 0 ? '0' : s.cover >= 36 ? '36+' : fmt1(s.cover)) : (s.stock > 0 ? '—' : '0');

// ---- per-SKU figures: monthly qty comes from the sales ETL records (domestic, Export store excluded) ----
const modelKey = sm => Object.keys(SALES.model_monthly_qty).find(k => k.toUpperCase() === (sm || '').toUpperCase());
function monthsOnSale(s) { if (!s.first_import) return 0; if (s.first_import < MONTHS[0]) return MONTHS.length; const i = MONTHS.indexOf(s.first_import); return i < 0 ? 0 : MONTHS.length - i; }
function statusOf(x) {
  if (x.stock <= 0) return x.avg > 0 ? 'out' : (x.on_order > 0 ? 'incoming' : 'none');
  if (x.avg <= 0) return 'idle';
  if (x.cover < S.lead) return 'order';
  if (x.cover > 12) return 'excess';
  return 'ok';
}
function compute() {
  SK.forEach(s => {
    s.sold2026 = MONTHS.reduce((a, m) => a + (s.monthly[m] || 0), 0);
    s.months = monthsOnSale(s);
    // a SKU can have sales recorded before its first import month in the stock sheet (pre-orders): count from the first sale then
    const firstSale = MONTHS.find(m => (s.monthly[m] || 0) > 0);
    if (firstSale) s.months = Math.max(s.months, MONTHS.length - MONTHS.indexOf(firstSale));
    s.avg = s.months > 0 ? s.sold2026 / s.months : 0;
    s.recent = RECENT.reduce((a, m) => a + (s.monthly[m] || 0), 0) / RECENT.length;
    s.cover = s.avg > 0 ? s.stock / s.avg : (s.stock > 0 ? Infinity : 0); s.status = statusOf(s);
  });
  const map = new Map();
  SK.forEach(s => { let g = map.get(s.model); if (!g) { g = {model: s.model, sales_model: s.sales_model, stock: 0, on_order: 0, s2026: 0, sold2026: 0, avg: 0, recent: 0, skus: 0}; map.set(s.model, g); } g.stock += s.stock; g.on_order += s.on_order; g.s2026 += s.s2026; g.sold2026 += s.sold2026; g.avg += s.avg; g.recent += s.recent; g.skus++; });
  const models = [...map.values()].sort((a, b) => a.model.localeCompare(b.model));
  const seen = new Set();
  models.forEach(g => {
    g.cover = g.avg > 0 ? g.stock / g.avg : (g.stock > 0 ? Infinity : 0); g.status = statusOf(g);
    const mk = modelKey(g.sales_model), mq = mk ? SALES.model_monthly_qty[mk] : null;
    g.primary = !!mq && !seen.has(mk); if (mq) seen.add(mk);
    g.raw = mq ? MONTHS.map(m => mq[m] || 0) : null;           // model total incl. the Export store
    g.export = mk ? (D.export_by_model[mk] || 0) : 0;
  });
  return models;
}

// ---- 在庫一覧 ----
const COLS = [
  {k: 'model', l: 'モデル', left: true}, {k: 'color', l: 'カラー', left: true}, {k: 'size_num', l: 'サイズ', left: true, r: s => esc(s.size)}, {k: 'gender', l: '性別', left: true},
  {k: 'stock', l: '在庫数', r: s => fmt(s.stock)},
  {k: 'avg', l: `今年の月平均<br><span class="muted">${+MONTHS[0].slice(5)}〜${+MONTHS[MONTHS.length - 1].slice(5)}月</span>`, r: s => fmt1(s.avg)},
  {k: 'recent', l: `直近3ヶ月の月平均<br><span class="muted">${+RECENT[0].slice(5)}〜${+RECENT[RECENT.length - 1].slice(5)}月</span>`, r: s => fmt1(s.recent)},
  {k: 'cover', l: '在庫月数', r: s => coverText(s)},
  {k: 'status', l: 'ステータス', left: true, r: s => badge(s.status)},
];
const NUMERIC = new Set(['stock', 'avg', 'recent', 'cover']);
function defaultSort(a, b) { return a.model.localeCompare(b.model) || a.color.localeCompare(b.color) || a.gender.localeCompare(b.gender) || (a.size_num - b.size_num); }
function renderList(models) {
  const counts = {}; SK.forEach(s => counts[s.status] = (counts[s.status] || 0) + 1);
  $('statusChips').innerHTML = Object.keys(STATUS).map(k => `<span class="chip ${S.status.has(k) ? 'active' : ''}" data-k="${k}"><span class="dot" style="background:${STATUS[k].color}"></span>${STATUS[k].label}<span class="n">${counts[k] || 0}</span></span>`).join('');
  $('statusChips').querySelectorAll('.chip').forEach(c => c.onclick = () => { const k = c.dataset.k; S.status.has(k) ? S.status.delete(k) : S.status.add(k); renderList(models); });
  const ms = $('modelSel'); ms.innerHTML = `<option value="">すべて</option>` + models.map(g => `<option value="${esc(g.model)}">${esc(g.model)}</option>`).join(''); ms.value = S.model;
  const q = S.color.trim().toLowerCase();
  const rows = SK.filter(s => S.status.has(s.status) && (!S.model || s.model === S.model) && (!S.gender || s.gender === S.gender) && (!q || s.color.toLowerCase().includes(q)));
  if (S.sort) { const k = S.sort; rows.sort((a, b) => { const av = a[k], bv = b[k]; const c = NUMERIC.has(k) || k === 'size_num' ? (av === bv ? 0 : (av === Infinity ? 1 : bv === Infinity ? -1 : av - bv)) : String(av ?? '').localeCompare(String(bv ?? '')); return c * S.dir || defaultSort(a, b); }); }
  else rows.sort(defaultSort);
  $('count').textContent = `${rows.length} / ${SK.length} SKU · 在庫 ${fmt(rows.reduce((a, s) => a + s.stock, 0))}足`;
  let prev = null;
  $('skuTable').innerHTML = `<table class="tbl"><thead><tr>${COLS.map(c => `<th class="${c.left ? 'l' : ''} ${S.sort === c.k ? 'sorted' : ''}" data-k="${c.k}">${c.l}${S.sort === c.k ? (S.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>${rows.map(s => { const start = !S.sort && s.item !== prev; prev = s.item; return `<tr class="${start ? 'item-start' : ''}">${COLS.map(c => `<td class="${c.left ? 'l' : 'num'}">${c.r ? c.r(s) : esc(s[c.k])}</td>`).join('')}</tr>`; }).join('')}</tbody></table>`;
  // click cycle: first direction (desc for numbers, asc for text) -> reverse -> back to alphabetical
  const firstDir = k => NUMERIC.has(k) ? -1 : 1;
  $('skuTable').querySelectorAll('th').forEach(th => th.onclick = () => { const k = th.dataset.k; if (S.sort === k) { if (S.dir === firstDir(k)) S.dir = -S.dir; else { S.sort = null; S.dir = 1; } } else { S.sort = k; S.dir = firstDir(k); } renderList(models); });
}
function exportCsv() {
  const head = ['モデル', 'カラー', 'サイズ', '性別', '在庫数', '今年の月平均', '直近3ヶ月の月平均', '在庫月数', 'ステータス', '入荷予定', '2026年販売(実績)', '販売月数', '初入荷', ...MONTHS.map(m => m + ' 販売'), '2026年販売(在庫表)', '2025年販売(在庫表)'];
  const rows = SK.slice().sort(defaultSort).map(s => [s.model, s.color, s.size, s.gender, s.stock, s.avg.toFixed(2), s.recent.toFixed(2), s.avg > 0 ? (s.cover >= 99 ? '99+' : s.cover.toFixed(1)) : (s.stock > 0 ? 'inf' : '0'), STATUS[s.status].label, s.on_order, s.sold2026, s.months, s.first_import || '', ...MONTHS.map(m => s.monthly[m] || 0), s.s2026, s.s2025]);
  const csv = '﻿' + [head, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'})); a.download = `vff_stock_${D.as_of}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---- 詳細 ----
function renderDetail(models) {
  const stock = SK.reduce((a, s) => a + s.stock, 0), avg = SK.reduce((a, s) => a + s.avg, 0), recent = SK.reduce((a, s) => a + s.recent, 0), onOrder = SK.reduce((a, s) => a + s.on_order, 0);
  const cnt = k => SK.filter(s => s.status === k).length;
  $('kpis').innerHTML = `
    <div class="kpi"><div class="kpi-label">総在庫(${D.as_of})</div><div class="kpi-value">${fmt(stock)}<small>足</small></div><div class="kpi-sub">${SK.length} SKU · ${models.length} モデル · 入荷予定 +${fmt(onOrder)}</div></div>
    <div class="kpi"><div class="kpi-label">今年の月平均販売</div><div class="kpi-value">${fmt(avg)}<small>足/月</small></div><div class="kpi-sub">2026年1〜8月 計 ${fmt(SK.reduce((a, s) => a + s.sold2026, 0))}足(国内・SKU照合分)· 直近3ヶ月 ${fmt(recent)}足/月</div></div>
    <div class="kpi"><div class="kpi-label">在庫月数(全体)</div><div class="kpi-value">${fmt1(stock / avg)}<small>ヶ月</small></div><div class="kpi-sub">在庫 ÷ 今年の月平均</div></div>
    <div class="kpi out"><div class="kpi-label">欠品中</div><div class="kpi-value">${cnt('out')}<small>SKU</small></div><div class="kpi-sub">在庫0で今年販売あり</div></div>
    <div class="kpi order"><div class="kpi-label">要発注</div><div class="kpi-value">${cnt('order')}<small>SKU</small></div><div class="kpi-sub">在庫月数 ${S.lead}ヶ月未満</div></div>
    <div class="kpi excess"><div class="kpi-label">在庫過剰</div><div class="kpi-value">${cnt('excess')}<small>SKU</small></div><div class="kpi-sub">在庫月数 12ヶ月超 · 計 ${fmt(SK.filter(s => s.status === 'excess').reduce((a, s) => a + s.stock, 0))}足</div></div>`;
  $('legend').innerHTML = Object.keys(STATUS).map(k => `<span><span class="sw" style="background:${STATUS[k].color}"></span>${STATUS[k].label} <span class="muted">— ${STATUS[k].desc.replace('リードタイム', `リードタイム(${S.lead}ヶ月)`)}</span></span>`).join('');
  $('defs').innerHTML = [
    ['在庫数', '在庫表の Balance 列(輸入累計 − 販売累計)'],
    ['今年の月平均', `SKU の 2026年${+MONTHS[0].slice(5)}〜${+MONTHS[MONTHS.length - 1].slice(5)}月の販売足数(販売実績の明細を SKU 単位で集計、輸出を除く)÷ 販売月数。初入荷(または初販売)が2026年ならその月〜${+MONTHS[MONTHS.length - 1].slice(5)}月、それ以前なら ${MONTHS.length}ヶ月`],
    ['直近3ヶ月の月平均', `SKU の ${RECENT.map(mLab).join('・')}の販売足数 ÷ 3(同じ明細から。輸出を除く)`],
    ['在庫月数', '在庫数 ÷ 今年の月平均'],
    ['入荷予定', '在庫表の Order Import 列(発注済み・未入荷)。到着月は在庫表に無い'],
    ['ステータス', `欠品中 → 要発注(< ${S.lead}ヶ月)→ 適正 → 在庫過剰(> 12ヶ月)。販売0は 動きなし / 入荷待ち / 在庫なし`],
  ].map(([k, v]) => `<div><div class="k">${k}</div>${v}</div>`).join('');

  const maxStock = Math.max(...models.map(g => g.stock), 1);
  const tot = {stock: 0, on_order: 0, s2026: 0, avg: 0, recent: 0, raw: MONTHS.map(() => 0), export: 0};
  models.forEach(g => { tot.stock += g.stock; tot.on_order += g.on_order; tot.s2026 += g.s2026; tot.sold2026 = (tot.sold2026 || 0) + g.sold2026; tot.avg += g.avg; tot.recent += g.recent; if (g.primary) { g.raw.forEach((v, i) => tot.raw[i] += v); tot.export += g.export; } });
  const recentIdx = RECENT.map(m => MONTHS.indexOf(m));
  const cell = (v, i) => `<td class="num ${recentIdx.includes(i) ? '' : 'dim'}">${fmt(v)}</td>`;
  $('modelTable').innerHTML = `<table class="tbl"><thead><tr>
      <th class="l">モデル</th><th>在庫</th><th>入荷予定</th><th>2026年販売<br><span class="muted">SKU照合分</span></th><th>今年の<br>月平均</th><th>直近3ヶ月<br><span class="muted">月平均</span></th><th>在庫月数</th><th class="l">ステータス</th>
      ${MONTHS.map(m => `<th>${mLab(m)}</th>`).join('')}<th>2026年計<br><span class="muted">モデル全体</span></th><th>2026年販売<br><span class="muted">在庫表</span></th>
    </tr></thead><tbody>${models.map(g => `<tr>
      <td class="l"><span class="bar" style="width:${Math.max(2, g.stock / maxStock * 80)}px"></span>${esc(g.model)}</td>
      <td class="num">${fmt(g.stock)}</td><td class="num dim">${g.on_order ? '+' + fmt(g.on_order) : ''}</td><td class="num">${fmt(g.sold2026)}</td><td class="num">${fmt1(g.avg)}</td><td class="num">${fmt1(g.recent)}</td><td class="num">${coverText(g)}</td><td class="l">${badge(g.status)}</td>
      ${g.primary ? g.raw.map(cell).join('') + `<td class="num">${fmt(g.raw.reduce((a, b) => a + b, 0))}${g.export ? `<span class="muted"> (うち輸出 ${fmt(g.export)})</span>` : ''}</td>`
                  : `<td class="dim l" colspan="${MONTHS.length + 1}">${g.sales_model ? `${esc(g.sales_model.replace(/^VFF /, ''))} に含まれる` : '販売実績に該当なし'}</td>`}
      <td class="num dim">${fmt(g.s2026)}</td>
    </tr>`).join('')}<tr class="total"><td class="l">合計</td><td class="num">${fmt(tot.stock)}</td><td class="num">+${fmt(tot.on_order)}</td><td class="num">${fmt(tot.sold2026)}</td><td class="num">${fmt1(tot.avg)}</td><td class="num">${fmt1(tot.recent)}</td><td class="num">${fmt1(tot.stock / tot.avg)}</td><td></td>${tot.raw.map(cell).join('')}<td class="num">${fmt(tot.raw.reduce((a, b) => a + b, 0))}</td><td class="num dim">${fmt(tot.s2026)}</td></tr></tbody></table>`;
  $('modelNote').innerHTML = `月別の列はモデル全体(全カラー・全サイズ、旧カラー含む)の販売足数で、明るい列 = 直近3ヶ月。<b>${+D.export_month.slice(5)}月には一括輸出 ${fmt(D.export_total)}足</b>(${Object.entries(D.export_by_model).map(([m, q]) => `${esc(m.replace(/^VFF /, ''))} ${fmt(q)}`).join(' / ')})が含まれますが、SKU 別の数字(今年の月平均・直近3ヶ月)からは除いています。「2026年販売 在庫表」は在庫表の販売列(参考)。`;

  const rec = D.reconciliation;
  $('dataNote').innerHTML = `<ul>
    <li><b>在庫</b>: <code>${esc(D.source_file)}</code>(${D.as_of} 時点、シート Net (2))。Office 列(実棚)は7月入荷分が未記入のため未使用。店舗別在庫列は空欄で、店舗別の内訳は出せない。</li>
    <li><b>販売実績</b>: 販売実績ダッシュボード(${esc(SALES.source_repo)})の ETL スクリプトをこのPCで同じ生データ(店舗・EC・委託・百貨店の明細 Excel)に対して実行し、VFF シューズを SKU(モデル×性別×カラー×サイズ)× 月で集計。除外店舗も同じ(${SALES.excluded_stores.map(esc).join('、')})。7月は「7〜8月ファイル」を正とし、7月単月ファイルとの二重計上を避けている。</li>
    <li><b>SKU 照合</b>: 明細のカラー・サイズ表記を在庫表と突き合わせ。在庫表にあるモデルで照合できなかった販売は ${fmt(D.unmatched_stocked_qty)}足(在庫表に無い旧カラー: ${D.unmatched_stocked.slice(0, 6).map(u => `${esc(u.model.replace(/^VFF /, ''))} ${esc(u.gender)} ${esc(String(u.color))}`).filter((v, i, a) => a.indexOf(v) === i).join('、')} など)。在庫表に無いモデル(Furoshiki、CVT-Hemp、V-Trail 2.0 など旧モデル)の ${fmt(D.unmatched_other_qty)}足は対象外。</li>
    <li>Trailope WP は Trailope、Groundsplay LS は Groundsplay の一部として明細に現れる(カラーで区別)。Scramkey はサイズ表記に M/W が無くユニセックス(U)扱い。</li>
    <li>更新: 月末の在庫表 → <code>extract_stock.py</code>、生データ → <code>stage_raw_sales.py</code> → <code>sales_etl/*.py</code> → <code>sku_sales.py</code>、<code>build.py</code> で生成して main に push(Vercel が自動デプロイ)。</li>
  </ul>
  <div style="font-size:13px;font-weight:600;margin:14px 0 6px">販売実績ダッシュボード(公開JSON)との突合 — モデル別 2026年1〜8月 足数</div>
  <div class="tbl-wrap" style="max-height:none"><table class="tbl"><thead><tr><th class="l">モデル</th><th>このページ(ローカルETL)</th><th>販売ダッシュボード</th><th>差</th></tr></thead><tbody>${rec.map(r => `<tr><td class="l">${esc(r.model)}</td><td class="num">${fmt(r.local)}</td><td class="num">${fmt(r.json)}</td><td class="num ${r.local - r.json ? '' : 'dim'}">${r.local - r.json > 0 ? '+' : ''}${fmt(r.local - r.json)}</td></tr>`).join('')}<tr class="total"><td class="l">合計</td><td class="num">${fmt(rec.reduce((a, r) => a + r.local, 0))}</td><td class="num">${fmt(rec.reduce((a, r) => a + r.json, 0))}</td><td class="num">${fmt(rec.reduce((a, r) => a + r.local - r.json, 0))}</td></tr></tbody></table></div>
  <div class="note">店舗×月ではイベントの5月(+3足)以外すべて一致。モデル別の±数足は、公開JSON側が7月のモデル内訳を売上比で近似していた(JSON 作成時のパッチ)ことによる差で、このページの明細ベースの方が正確。</div>`;
}

function renderAll() { const models = compute(); renderList(models); renderDetail(models); }
function switchTab(name) { document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name)); document.querySelectorAll('.tabpanel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name)); }
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
$('periodLine').innerHTML = `在庫: <b>${D.as_of}</b> 時点(${esc(D.source_file)})<br>販売実績: <b>${MONTHS[0]}〜${MONTHS[MONTHS.length - 1]}</b>(sales-1st-half-26-dashboard)`;
$('footer').textContent = `ビルド ${D.built_at} · 在庫 ${SK.length} SKU · 販売実績ソース ${SALES.source_repo}@${(SALES.source_commit || '').slice(0, 7)}`;
$('leadSel').onchange = e => { S.lead = +e.target.value; renderAll(); };
$('modelSel').onchange = e => { S.model = e.target.value; renderAll(); };
$('genderSel').onchange = e => { S.gender = e.target.value; renderAll(); };
$('colorInput').oninput = e => { S.color = e.target.value; renderAll(); };
$('csvBtn').onclick = exportCsv;
renderAll();
})();
</script>
</body>
</html>
